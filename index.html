<!-- Selector de Ubicación (Estantes E1-E10 y Filas F1-F5) -->
<div>
  <input type="text" id="rec-ubicacion" readonly required placeholder="Ubicación Seleccionada (Estante y Fila) *" class="w-full px-3 py-2 border rounded-lg bg-slate-50 font-mono font-bold text-blue-600 text-xs mb-2 text-center">

  <!-- Estantes (E1-E10) -->
  <div class="mb-2">
    <span class="block text-[10px] text-slate-500 font-bold mb-1">1. Seleccionar Estante:</span>
    <div id="shelf-buttons" class="grid grid-cols-5 gap-1.5">
      <!-- Los botones de estantes se renderizan automáticamente desde app.js -->
    </div>
  </div>

  <!-- Filas (Aparecen al elegir estante) -->
  <div id="rows-container" class="hidden mt-2 pt-2 border-t border-slate-100">
    <span class="block text-[10px] text-slate-500 font-bold mb-1">2. Seleccionar Fila:</span>
    <div id="row-buttons" class="grid grid-cols-5 gap-1.5">
      <!-- Los botones de filas se renderizan dinámicamente -->
    </div>
  </div>
</div>
